# computing-lab environment: Vite+React SPA (src/) + Hono/node:sqlite API
# (server/). Bun 1.2.17 is the pinned package manager; the server itself runs
# via `node server/index.ts` (node strip-only TS — no enum/namespace/parameter
# properties under server/).
initialize: |
  curl -fsSL https://bun.sh/install | bash -s "bun-v1.2.17"
  echo "PATH=$HOME/.bun/bin:$PATH" >> $ENVRC
  $HOME/.bun/bin/bunx playwright install chromium --with-deps
maintenance: |
  $HOME/.bun/bin/bun install --frozen-lockfile
knowledge:
  - name: quality-gates
    contents: |
      bun run format:check; bun run lint; bun run typecheck; bun run test:run; bun run build
      bun run test:e2e; bun run test:deploy; bun run test:caddy (needs CADDY_BIN pointing at caddy v2.10.2)
  - name: run-server
    contents: |
      export PATH="$HOME/.nvm/versions/node/v24.19.0/bin:$PATH"
      node server/db/seed.ts && node server/index.ts
  - name: seed-accounts
    contents: |
      admin/admin-dev-password, teacher/teacher-dev-password; class 2026-高一信息技术-01, invite CLASS26
